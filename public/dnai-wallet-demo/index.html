<style>

  .is-screen{animation:is-rise 240ms cubic-bezier(.2,.6,.2,1)}

<body>
<div id="cc-demo-badge" role="note" style="position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:2147483647;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;border:1px solid rgba(216,168,74,.45);background:rgba(11,33,56,.92);backdrop-filter:blur(6px);box-shadow:0 4px 18px rgba(0,0,0,.35);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:#E4C97F;white-space:nowrap;pointer-events:none">
  <span style="width:6px;height:6px;border-radius:50%;background:#E4C97F;flex:none"></span>
  Demo · Flare Coston2 testnet · simulated data · not a live genome
</div>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:radial-gradient(circle at 50% 0%,#F4F7FB,#DDE5EE)">
  <div style="width:390px;max-width:100%;height:min(812px,calc(100vh - 32px));background:#050F1B;border-radius:38px;padding:8px;box-sizing:border-box;box-shadow:0 30px 70px rgba(8,24,42,.35)">
    <div style="width:100%;height:100%;border-radius:31px;overflow:hidden;background:linear-gradient(180deg,#0B2138 0%,#08182A 55%,#050F1B 100%);display:flex;flex-direction:column;position:relative">

      <!-- status bar -->
      <div style="height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px;color:#fff;font-size:12.5px;font-weight:600">
        <span>9:41</span>
        <svg width="44" height="12" viewBox="0 0 46 13"><g fill="currentColor"><rect x="0" y="7" width="3" height="6" rx="1"></rect><rect x="5" y="5" width="3" height="8" rx="1"></rect><rect x="10" y="3" width="3" height="10" rx="1"></rect><rect x="15" y="0" width="3" height="13" rx="1"></rect></g><rect x="27" y="1.5" width="16" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.2"></rect><rect x="29.4" y="3.5" width="9" height="6" rx="1" fill="currentColor"></rect><rect x="44" y="4" width="1.6" height="4" rx=".7" fill="currentColor"></rect></svg>
      </div>

      <!-- brand header -->

        <div style="display:flex;align-items:center;gap:9px">

            <svg width="14" height="18" viewBox="0 0 48 84"><path d="M24 8C42 18 42 30 24 40 6 50 6 62 24 72" stroke="#8AC3EC" stroke-width="5" fill="none" stroke-linecap="round"></path><path d="M24 8C6 18 6 30 24 40 42 50 42 62 24 72" stroke="#78B463" stroke-width="5" fill="none" stroke-linecap="round"></path></svg>

      <!-- signing overlay + toast -->
      <div id="overlay-root" style="display:contents"></div>

    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var SEGMENTS = [
    { id: 'coding', name: 'Coding genes', color: '#78B463', desc: 'Protein-coding exome, ~20,000 genes', size: '12.4 GB', variants: '38,102 variants' },
    { id: 'pharma', name: 'Pharmacogenomics', color: '#4FA5E2', desc: 'Drug-metabolism markers, CYP450 panel', size: '2.1 GB', variants: '412 variants' },
    { id: 'ancestry', name: 'Ancestry', color: '#C9A876', desc: 'Haplogroup and population structure', size: '0.8 GB', variants: '9,640 markers' },
    { id: 'rare', name: 'Rare variants', color: '#8AC3EC', desc: 'Sub-1% allele frequency, Mendelian candidates', size: '4.6 GB', variants: '1,208 variants' }
  ];

  var ICONS = {
    vault: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z',
    bell: 'M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M10.3 21a1.9 1.9 0 0 0 3.4 0',
    log: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8ZM14 2v6h6M9 13h6M9 17h4',
    lab: 'M9 2v7L4 19a2 2 0 0 0 1.8 3h12.4A2 2 0 0 0 20 19L15 9V2M9 2h6M7 14h10'
  };

  var state = {
    screen: 'vault',
    role: 'owner',
    segmentId: null,
    requestId: 'r1',
    signing: false,
    signStep: 0,
    toast: '',
    picked: ['coding'],
    mode: 'zk',
    duration: 12,
    requests: [
      { id: 'r1', org: 'Broad Institute', initials: 'BI', meta: 'Verified · Cambridge, MA · non-profit',
        purpose: 'Studying rare Mendelian disease mechanisms across a de-identified cohort of 40,000 genomes.',
        scope: 'Coding genes', duration: '12 months', royalty: '0.75 FLR / query', mode: 'Compute-only (ZK)', escrow: '900 FLR' },
      { id: 'r2', org: 'MedGenix Labs', initials: 'MG', meta: 'Verified · Basel, CH · commercial',
        purpose: 'Building a pharmacogenomic dosing model for anticoagulant therapy in adults over 60.',
        scope: 'Pharmacogenomics', duration: '24 months', royalty: '1.40 FLR / query', mode: 'Compute-only (ZK)', escrow: '3,360 FLR' },
      { id: 'r3', org: 'Kyoto Therapeutics', initials: 'KT', meta: 'Verified · Kyoto, JP · commercial',
        purpose: 'Screening rare loss-of-function variants as targets for an antisense therapy program.',
        scope: 'Rare variants', duration: '6 months', royalty: '2.10 FLR / query', mode: 'Aggregate statistics', escrow: '1,260 FLR' }
    ],
    grants: [
      { id: 'g1', seg: 'coding', org: 'Wellcome Sanger Institute', initials: 'WS', mode: 'Compute-only', expires: 'Nov 2026' },
      { id: 'g2', seg: 'ancestry', org: 'Univ. of Virginia', initials: 'UV', mode: 'Aggregate stats', expires: 'Mar 2027' }
    ],
    activity: [
      { title: 'Query executed', detail: 'Wellcome Sanger ran variant-frequency query on coding genes', time: '2h ago', tx: '0x3ab9…7c02', color: '#4FA5E2' },
      { title: 'Royalty settled', detail: '0.75 FLR credited to the family treasury', time: '2h ago', tx: '0x91de…44b1', color: '#78B463' },
      { title: 'Grant issued', detail: 'Univ. of Virginia · ancestry · aggregate statistics', time: '4 days ago', tx: '0x77c1…9ee0', color: '#78B463' },
      { title: 'Request denied', detail: 'Helix Data Partners · commercial resale scope', time: '11 days ago', tx: '0x0d42…31aa', color: '#C53030' },
      { title: 'Token minted', detail: 'Whole genome anchored · 2-of-3 Safe custody established', time: '8 months ago', tx: '0x7f3e…91a4', color: '#8AC3EC' }
    ]
  };

  var t1, t2, t3;

  function fakeTx() {
    return '0x' + Math.random().toString(16).slice(2, 6) + '…' + Math.random().toString(16).slice(2, 6);
  }

  function setState(patch) {
    for (var k in patch) state[k] = patch[k];
    render();
  }

  function flash(msg) {
    clearTimeout(t3);
    setState({ toast: msg });
    t3 = setTimeout(function () { setState({ toast: '' }); }, 2600);
  }

  function currentRequest() {
    for (var i = 0; i < state.requests.length; i++) {
      if (state.requests[i].id === state.requestId) return state.requests[i];
    }
    return state.requests[0] || null;
  }

  function currentSegment() {
    for (var i = 0; i < SEGMENTS.length; i++) {
      if (SEGMENTS[i].id === state.segmentId) return SEGMENTS[i];
    }
    return SEGMENTS[0];
  }

  function researcherRate() { return state.mode === 'zk' ? 0.75 : 0.4; }
  function researcherRoyalty() { return (researcherRate() * state.picked.length).toFixed(2); }
  function researcherEscrow() { return Math.round(researcherRate() * state.picked.length * state.duration * 100); }

  /* ---------- actions ---------- */

  var actions = {
    'toggle-role': function () {
      var toResearcher = state.role === 'owner';
      setState({ role: toResearcher ? 'researcher' : 'owner', screen: toResearcher ? 'researcher' : 'vault' });
    },
    'go-tab': function (el) {
      var id = el.getAttribute('data-id');
      setState({ screen: id, role: id === 'researcher' ? 'researcher' : 'owner' });
    },
    'open-segment': function (el) {
      setState({ screen: 'segment', segmentId: el.getAttribute('data-id') });
    },
    'back-vault': function () { setState({ screen: 'vault' }); },
    'revoke-grant': function (el) {
      var id = el.getAttribute('data-id');
      var seg = currentSegment();
      var grant = null;
      state.grants = state.grants.filter(function (g) {
        if (g.id === id) { grant = g; return false; }
        return true;
      });
      if (grant) {
        state.activity = [{ title: 'Access revoked', detail: grant.org + ' · ' + seg.name.toLowerCase(), time: 'just now', tx: fakeTx(), color: '#C53030' }].concat(state.activity);
      }
      flash('Access revoked on-chain. Effective immediately.');
    },
    'open-request': function (el) {
      setState({ screen: 'request', requestId: el.getAttribute('data-id') });
    },
    'back-requests': function () { setState({ screen: 'requests' }); },
    'approve': function () {
      setState({ signing: true, signStep: 1 });
      t1 = setTimeout(function () { setState({ signStep: 2 }); }, 1500);
      t2 = setTimeout(function () {
        var req = currentRequest();
        if (!req) return;
        var segId = SEGMENTS[0].id;
        for (var i = 0; i < SEGMENTS.length; i++) {
          if (SEGMENTS[i].name === req.scope) { segId = SEGMENTS[i].id; break; }
        }
        state.requests = state.requests.filter(function (r) { return r.id !== req.id; });
        state.grants = [{ id: 'g' + Date.now(), seg: segId, org: req.org, initials: req.initials, mode: req.mode, expires: 'Aug 2027' }].concat(state.grants);
        state.activity = [{ title: 'Grant issued', detail: req.org + ' · ' + req.scope.toLowerCase() + ' · ' + req.mode.toLowerCase(), time: 'just now', tx: fakeTx(), color: '#78B463' }].concat(state.activity);
        setState({ signStep: 3 });
      }, 3000);
    },
    'deny': function () {
      var req = currentRequest();
      if (!req) return;
      state.requests = state.requests.filter(function (r) { return r.id !== req.id; });
      state.activity = [{ title: 'Request denied', detail: req.org + ' · ' + req.scope.toLowerCase(), time: 'just now', tx: fakeTx(), color: '#C53030' }].concat(state.activity);
      setState({ screen: 'requests' });
      flash('Request denied. Nothing was written to the vault.');
    },
    'counter': function () { flash('Counter-offer drafted. Adjust terms, then re-sign.'); },
    'close-signing': function () { setState({ signing: false, signStep: 0, screen: 'vault' }); },
    'pick-segment': function (el) {
      var id = el.getAttribute('data-id');
      var i = state.picked.indexOf(id);
      if (i >= 0) state.picked.splice(i, 1); else state.picked.push(id);
      render();
    },
    'pick-mode': function (el) { setState({ mode: el.getAttribute('data-id') }); },
    'pick-duration': function (el) { setState({ duration: parseInt(el.getAttribute('data-n'), 10) }); },
    'submit-request': function () {
      if (!state.picked.length) { flash('Select at least one segment to request.'); return; }
      var names = state.picked.map(function (p) {
        for (var i = 0; i < SEGMENTS.length; i++) if (SEGMENTS[i].id === p) return SEGMENTS[i].name;
        return p;
      });
      state.requests = state.requests.concat([{
        id: 'r' + Date.now(), org: 'Nordic Rare Disease Institute', initials: 'NR',
        meta: 'Verified · Uppsala, SE · non-profit',
        purpose: 'Mapping founder variants across Nordic populations to prioritize antisense therapy targets.',
        scope: names.join(', '), duration: state.duration + ' months',
        royalty: researcherRoyalty() + ' FLR / query',
        mode: state.mode === 'zk' ? 'Compute-only (ZK)' : 'Aggregate statistics',
        escrow: researcherEscrow().toLocaleString() + ' FLR'
      }]);
      flash('Submitted. Awaiting the owner’s signature.');
    }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!el) return;
    var fn = actions[el.getAttribute('data-action')];
    if (fn) fn(el);
  });

  /* ---------- screen renderers ---------- */

  function renderVault() {
    var rungColors = ['#78B463', '#4FA5E2', '#C9A876', '#8AC3EC'];
    var rungs = [50, 150, 250, 350].map(function (y, i) {
      var cx = i % 2 === 0 ? 64 : 16;
      return '<g>' +
        '<line x1="16" y1="' + y + '" x2="64" y2="' + y + '" stroke="' + rungColors[i] + '" stroke-width="4.5" stroke-linecap="round"></line>' +
        '<circle cx="' + cx + '" cy="' + y + '" r="6.5" fill="' + rungColors[i] + '"></circle>' +
        '<circle cx="' + cx + '" cy="' + y + '" r="11" fill="' + rungColors[i] + '" opacity=".22"></circle>' +
        '</g>';
    }).join('');

    var rows = SEGMENTS.map(function (seg) {
      var n = state.grants.filter(function (g) { return g.seg === seg.id; }).length;
      var grantLabel = n ? n + ' grant' + (n > 1 ? 's' : '') : 'private';
      var grantColor = n ? '#78B463' : '#5C7DA5';
      return '<button data-action="open-segment" data-id="' + seg.id + '" class="seg-btn" style="width:100%;display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);border-radius:11px;padding:11px 12px;margin-bottom:8px;text-align:left">' +
        '<span style="width:9px;height:9px;border-radius:2px;flex:none;background:' + seg.color + '"></span>' +
        '<span style="flex:1;min-width:0">' +
          '<span style="display:block;font-size:12.5px;font-weight:600;color:#EAF2FA">' + seg.name + '</span>' +
          '<span style="display:block;font-size:10.5px;color:#7B93AF;margin-top:2px">' + seg.desc + '</span>' +
        '</span>' +
        '<span style="text-align:right;flex:none">' +
          '<span style="display:block;font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:#5C7DA5">' + seg.size + '</span>' +
          '<span style="display:block;font-size:9.5px;font-weight:600;margin-top:3px;color:' + grantColor + '">' + grantLabel + '</span>' +
        '</span>' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C7DA5" stroke-width="2" style="flex:none"><path d="m9 5 7 7-7 7"></path></svg>' +
        '</button>';
    }).join('');

    return '<div class="is-scroll is-screen" style="flex:1;padding:0 20px 16px">' +
      '<div style="text-align:center;padding-top:2px">' +
        '<div style="font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#4FA5E2">Genomic Token · 1 of 1</div>' +
        '<div style="font-size:21px;font-weight:800;color:#fff;margin-top:5px;letter-spacing:-.3px">Whole Genome</div>' +
        '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;color:#5C7DA5;margin-top:5px">0x7f3e…91a4 · WGS 30× · 98.2 GB</div>' +
      '</div>' +
      '<div style="display:flex;justify-content:center;margin:6px 0 2px;position:relative">' +
        '<svg width="176" height="290" viewBox="0 0 80 400" style="animation:is-breathe 5s ease-in-out infinite">' +
          '<path d="M40 0C74 25 74 75 40 100 6 125 6 175 40 200 74 225 74 275 40 300 6 325 6 375 40 400" stroke="#2E8FD6" stroke-width="3" fill="none" opacity=".85"></path>' +
          '<path d="M40 0C6 25 6 75 40 100 74 125 74 175 40 200 6 225 6 275 40 300 74 325 74 375 40 400" stroke="#1F7BBE" stroke-width="3" fill="none" opacity=".6"></path>' +
          '<g stroke-width="4" stroke-linecap="round" opacity=".35">' +
            '<line x1="22" y1="20" x2="58" y2="20" stroke="#5C7DA5"></line><line x1="14" y1="90" x2="66" y2="90" stroke="#5C7DA5"></line>' +
            '<line x1="22" y1="120" x2="58" y2="120" stroke="#5C7DA5"></line><line x1="14" y1="190" x2="66" y2="190" stroke="#5C7DA5"></line>' +
            '<line x1="22" y1="220" x2="58" y2="220" stroke="#5C7DA5"></line><line x1="14" y1="290" x2="66" y2="290" stroke="#5C7DA5"></line>' +
            '<line x1="22" y1="320" x2="58" y2="320" stroke="#5C7DA5"></line><line x1="14" y1="390" x2="66" y2="390" stroke="#5C7DA5"></line>' +
          '</g>' + rungs +
        '</svg>' +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin:10px 0 9px">' +
        '<span style="font-size:12.5px;font-weight:700;color:#fff">Licensable segments</span>' +
        '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:#5C7DA5">' + state.grants.length + ' active grants</span>' +
      '</div>' +
      rows +
      '<div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);border-radius:11px;padding:13px;margin-top:4px">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px">' +
          '<span style="font-size:11.5px;font-weight:700;color:#EAF2FA">Custody · 2-of-3 multisig</span>' +
          '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:9px;color:#78B463;background:rgba(120,180,99,.14);padding:3px 7px;border-radius:999px">Safe</span>' +
        '</div>' +
        '<div style="display:flex;align-items:center">' +
          '<div style="display:flex">' +
            '<div style="width:32px;height:32px;border-radius:999px;background:#15355C;border:2px solid #0B2138;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#fff">EF</div>' +
            '<div style="width:32px;height:32px;border-radius:999px;background:#1F7BBE;border:2px solid #0B2138;margin-left:-9px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#fff">MF</div>' +
            '<div style="width:32px;height:32px;border-radius:999px;background:#4A8C3D;border:2px solid #0B2138;margin-left:-9px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#fff">RF</div>' +
          '</div>' +
          '<div style="margin-left:11px">' +
            '<div style="font-size:11.5px;font-weight:600;color:#EAF2FA">Everett, Mara &amp; Ruth</div>' +
            '<div style="font-size:10px;color:#7B93AF;margin-top:1px">Any two signatures release a grant</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:9px;margin-top:12px">' +
        '<div style="flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);border-radius:11px;padding:11px 12px">' +
          '<div style="font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#5C7DA5">Royalties</div>' +
          '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:15px;font-weight:600;color:#78B463;margin-top:5px">1,284 FLR</div>' +
        '</div>' +
        '<div style="flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);border-radius:11px;padding:11px 12px">' +
          '<div style="font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#5C7DA5">Anchored</div>' +
          '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:11.5px;font-weight:500;color:#8AC3EC;margin-top:7px">Flare · Coston2</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderSegment() {
    var seg = currentSegment();
    var segGrants = state.grants.filter(function (g) { return g.seg === seg.id; });

    var grantRows = segGrants.map(function (g) {
      return '<div style="display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);border-radius:11px;padding:11px 12px;margin-bottom:8px">' +

  function renderResearcher() {

      var border = on ? 'rgba(46,143,214,.55)' : 'rgba(255,255,255,.13)';

        '<span style="width:7px;height:7px;border-radius:2px;background:' + seg.color + '"></span>' + seg.name +
        '</button>';
    }).join('');

    var modeDefs = [
      { id: 'zk', name: 'Compute-only', desc: 'Query runs in the enclave; results only' },
      { id: 'agg', name: 'Aggregate stats', desc: 'Cohort-level counts, no per-record output' }

        '</button>';

    var durations = [6, 12, 24].map(function (d) {

        '<div style="width:30px;height:30px;border-radius:8px;background:#15355C;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#8AC3EC;flex:none">NR</div>' +
        '<div style="flex:1">' +
          '<div style="font-size:11.5px;font-weight:700;color:#fff">Nordic Rare Disease Institute</div>' +
          '<div style="font-size:10px;color:#7B93AF;margin-top:1px">Verified requester · Uppsala, SE</div>' +

      '<div style="display:flex;flex-wrap:wrap;gap:7px">' + chips + '</div>' +
      '<div style="font-size:11px;font-weight:700;color:#C5E1F6;margin:17px 0 8px">Access mode</div>' +

      '<div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);border-radius:11px;padding:13px;margin-top:17px">' +
        '<div style="display:flex;align-items:center;justify-content:space-between">' +
          '<span style="font-size:11px;color:#7B93AF">Royalty to the owner</span>' +

      ];
      var rows = signers.map(function (s) {
        var stateLabel = s.done ? 'Signed' : (s.name === 'Ruth Felton' ? 'Not required' : 'Waiting…');
        var stateColor = s.done ? '#78B463' : '#5C7DA5';
        return '<div style="display:flex;align-items:center;gap:11px;padding:9px 0">' +
          '<div style="width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#fff;flex:none;background:' + s.avatarBg + '">' + s.initials + '</div>' +
          '<div style="flex:1">' +
            '<div style="font-size:12px;font-weight:600;color:#EAF2FA">' + s.name + '</div>' +
            '<div style="font-size:10px;color:#7B93AF;margin-top:1px">' + s.role + '</div>' +
          '</div>' +
          '<div style="font-size:10.5px;font-weight:600;color:' + stateColor + '">' + stateLabel + '</div>' +
          '</div>';
      }).join('');

      var footer = done
        ? '<button data-action="close-signing" style="width:100%;background:#4A8C3D;border:none;color:#fff;border-radius:11px;padding:14px;font-size:13px;font-weight:700;margin-top:12px">View the grant</button>'
        : '<div style="display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;padding:13px;background:rgba(255,255,255,.05);border-radius:11px">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8AC3EC" stroke-width="2.4" style="animation:is-spin 900ms linear infinite"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg>' +
            '<span style="font-size:11.5px;font-weight:600;color:#C5E1F6">Broadcasting to Coston2…</span>' +
          '</div>';

      html += '<div style="position:absolute;inset:0;background:rgba(5,15,27,.82);backdrop-filter:blur(6px);display:flex;align-items:flex-end;z-index:20">' +
        '<div style="width:100%;background:#0E2440;border-top:1px solid rgba(255,255,255,.13);border-radius:20px 20px 31px 31px;padding:22px 20px 26px;animation:is-rise 260ms cubic-bezier(.2,.6,.2,1)">' +
          '<div style="width:36px;height:4px;border-radius:999px;background:rgba(255,255,255,.2);margin:0 auto 16px"></div>' +
          '<div style="font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#4FA5E2;text-align:center">' + (done ? 'Executed' : 'Multisig · 2 of 3') + '</div>' +
          '<div style="font-size:17px;font-weight:800;color:#fff;text-align:center;margin-top:6px;letter-spacing:-.2px">' + (done ? 'Access license minted' : 'Collecting signatures') + '</div>' +
          '<div style="font-size:11.5px;color:#9DB2C8;text-align:center;margin-top:6px;line-height:1.5">' + (done
            ? 'The grant is live and revocable. Every query against it will appear in your audit log.'
            : 'Two of three family signers must approve before the contract executes.') + '</div>' +
          '<div style="margin:18px 0 4px">' + rows + '</div>' +
          footer +
        '</div>' +
      '</div>';
    }

    if (state.toast) {
      html += '<div style="position:absolute;left:16px;right:16px;bottom:70px;background:#15355C;border:1px solid rgba(138,195,236,.35);border-radius:11px;padding:12px 14px;display:flex;align-items:center;gap:9px;z-index:30;animation:is-rise 200ms ease-out;box-shadow:0 10px 30px rgba(0,0,0,.4)">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#78B463" stroke-width="2.4" style="flex:none"><path d="M20 6 9 17l-5-5"></path></svg>' +
        '<span style="font-size:11.5px;font-weight:600;color:#EAF2FA;line-height:1.4">' + state.toast + '</span>' +
        '</div>';
    }

    return html;
  }

  /* ---------- root render ---------- */

  var screenRoot = document.getElementById('screen-root');
  var tabBar = document.getElementById('tab-bar');
  var overlayRoot = document.getElementById('overlay-root');
  var roleDot = document.getElementById('role-dot');
  var roleLabel = document.getElementById('role-label');

  var lastScreenKey = '';

  function render() {
    var isOwner = state.role === 'owner';
    roleDot.style.background = isOwner ? '#78B463' : '#C9A876';
    roleLabel.textContent = isOwner ? 'Owner' : 'Researcher';

    var screenKey, screenHtml;
    if (!isOwner || state.screen === 'researcher') {
      screenKey = 'researcher';
      screenHtml = renderResearcher();
    } else if (state.screen === 'segment') {
      screenKey = 'segment:' + state.segmentId;
      screenHtml = renderSegment();
    } else if (state.screen === 'requests') {
      screenKey = 'requests';
      screenHtml = renderRequests();
    } else if (state.screen === 'request') {
      screenKey = 'request:' + state.requestId;
      screenHtml = currentRequest() ? renderRequest() : renderRequests();
    } else if (state.screen === 'activity') {
      screenKey = 'activity';
      screenHtml = renderActivity();
    } else {
      screenKey = 'vault';
      screenHtml = renderVault();
    }

    // Preserve scroll position on same-screen re-renders (selection changes,
    // list mutations); the entry animation only plays on real screen changes.
    var prevScroll = 0;
    var prevScreenEl = screenRoot.firstElementChild;
    var sameScreen = screenKey === lastScreenKey;
    if (sameScreen && prevScreenEl) prevScroll = prevScreenEl.scrollTop;

    screenRoot.innerHTML = screenHtml;
    var screenEl = screenRoot.firstElementChild;
    if (sameScreen && screenEl) {
      screenEl.classList.remove('is-screen');
      screenEl.scrollTop = prevScroll;
    }
    lastScreenKey = screenKey;

    tabBar.innerHTML = renderTabBar();
    overlayRoot.innerHTML = renderOverlays();
  }

  render();
})();
</script>
</body>
</html>
